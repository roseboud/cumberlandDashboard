[build]
  # Base is already set to cumberlandDashboard in Netlify UI
  # So publish is relative to that — use "." for current dir
  base = "cumberlandDashboard"
  command = ""
  publish = "."

# ---------- Security Headers (all pages) ----------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self), payment=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' cdn.jsdelivr.net cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' fonts.googleapis.com cdn.jsdelivr.net; font-src fonts.gstatic.com; img-src 'self' data: blob: *.tile.opentopomap.org server.arcgisonline.com *.basemaps.cartocdn.com *.openstreetmap.org; connect-src 'self' api-iwls.dfo-mpo.gc.ca agrgims.cogs.nscc.ca; media-src 'self'; frame-ancestors 'self'"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# ---------- Cache Headers ----------
[[headers]]
  for = "/assets/geojson/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/styles/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/assets/tiles/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/assets/reportsAndModels/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
